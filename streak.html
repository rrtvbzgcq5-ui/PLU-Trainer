<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f8fc;
        color: #111;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
        padding: 25px 18px 40px;
        text-align: center;
    }

    .back {
        display: inline-block;
        margin-bottom: 25px;
        color: #0066cc;
        text-decoration: none;
        font-weight: bold;
    }

        margin: 5px 0 10px;

    }

        margin-bottom: 25px;
    }

    .score {
        font-size: 22px;
        font-weight: bold;
        color: #0066cc;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 30px 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .product {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 30px;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    button.answer {
        border: none;
        background: #0066cc;
        color: white;
        font-size: 24px;
        font-weight: bold;
        padding: 20px 10px;
        border-radius: 14px;
        cursor: pointer;
        transition: 0.15s;
    }

    button.answer:hover {
        background: #0055aa;
    }

    button.answer.correct {
        background: #21a366;
    }

    button.answer.wrong {
        background: #d93025;
    }

    button.answer.disabled {
        cursor: default;
    }

    .result {
        display: none;
    }

    .result h2 {
        font-size: 34px;
        margin-bottom: 10px;
    }

    .final-score {
        font-size: 52px;
        font-weight: bold;
        color: #0066cc;
        margin: 20px 0;
    }

    .restart {
        border: none;
        background: #0066cc;
        color: white;
        padding: 15px 25px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
    }

    .restart:hover {
        background: #0055aa;
    }

    @media (max-width: 500px) {
        h1 {
            font-size: 32px;
        }

        .product {
            font-size: 23px;
        }

        button.answer {
            font-size: 21px;
            padding: 18px 8px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <a href="https://rrtvbzgcq5-ui.github.io/PLU-Trainer/gamemodes" class="back">← Game Mods</a>

    <h1>🔥 Streak</h1>
    <div class="subtitle">
        Wie lange hältst du durch?
    </div>

    <div id="game">

        <div class="score">
            Streak: <span id="streak">0</span>
        </div>

        <div class="card">

            <div class="product" id="product">
                Produkt
            </div>

            <div class="answers" id="answers"></div>

        </div>

    </div>

    <div class="card result" id="result">

        <h2>Spiel vorbei!</h2>

        <div>Dein Streak:</div>

        <div class="final-score" id="finalScore">
            0

        <button class="restart" onclick="restartGame()">

const products = raw
    .trim()
    .split("\n")
    .filter(Boolean)
    .map(line => {
        const [name, plu] = line.split("|");
        return { name, plu };
    });

let currentProduct = null;
let streak = 0;
let locked = false;

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function getRandomProduct() {
    return products[Math.floor(Math.random() * products.length)];
}

function getAnswers(correctPLU) {

    const wrongAnswers = shuffle(
        products
            .filter(p => p.plu !== correctPLU)
            .map(p => p.plu)
            .filter((value, index, array) => array.indexOf(value) === index)
    ).slice(0, 3);

    return shuffle([
        correctPLU,
        ...wrongAnswers
    ]);
}

function nextQuestion() {

    locked = false;

    currentProduct = getRandomProduct();

    document.getElementById("product").textContent =
        currentProduct.name;

    document.getElementById("streak").textContent =
        streak;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    getAnswers(currentProduct.plu).forEach(plu => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = plu;

        button.onclick = () => checkAnswer(button, plu);

        answers.appendChild(button);
    });
}

function checkAnswer(button, answer) {

    if (locked) return;

    locked = true;

    const buttons =
        document.querySelectorAll(".answer");

    if (answer === currentProduct.plu) {

        button.classList.add("correct");

        streak++;

        document.getElementById("streak").textContent =
            streak;

        setTimeout(() => {
            nextQuestion();
        }, 350);

    } else {

        button.classList.add("wrong");

        buttons.forEach(btn => {

            if (btn.textContent === currentProduct.plu) {
                btn.classList.add("correct");
            }

            btn.classList.add("disabled");
        });

        setTimeout(() => {
            endGame();
        }, 800);
    }
}

function endGame() {

    document.getElementById("game").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent =
        streak;
}

function restartGame() {

    streak = 0;

    document.getElementById("game").style.display = "block";

    document.getElementById("result").style.display = "none";

    nextQuestion();
}

nextQuestion();
