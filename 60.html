<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>60 Sekunden – PLU Trainer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fc;
            color: #123;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #005bbb;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin: 0 0 10px;
            color: #005bbb;
        }

        .subtitle {
            text-align: center;
            color: #607080;
            margin-bottom: 30px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
            font-weight: 700;
        }

        #timer {
            color: #005bbb;
            font-size: 22px;
        }

        .warning {
            color: #d9363e !important;
        }

        .question-box {
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .answer {
            border: none;
            border-radius: 13px;
            padding: 18px;
            background: #005bbb;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .answer:hover {
            transform: translateY(-2px);
        }

        .answer:disabled {
            cursor: default;
        }

        .correct {
            background: #239b56 !important;
        }

        .wrong {
            background: #d9363e !important;
        }

        .result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 700;
            min-height: 27px;
        }

        .finished {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .finished h2 {
            color: #005bbb;
            font-size: 32px;
            margin-top: 0;
        }

        .score {
            font-size: 48px;
            font-weight: 800;
            margin: 20px 0;
        }

        .restart {
            border: none;
            border-radius: 13px;
            padding: 15px 25px;
            background: #005bbb;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 36px;
            }

            .answers {
                grid-template-columns: 1fr;
            }

            .product {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="game-mods.html" class="back">
        ← Zurück zu Game Mods
    </a>

    <h1>⚡ 60 Sekunden</h1>

    <div class="subtitle">
        So viele richtige Antworten wie möglich!
    </div>


    <div id="game">

        <div class="status">

            <span id="timer">
                01:00
            </span>

            <span id="score">
                Richtig: 0
            </span>

        </div>


        <div class="question-box">

            <div class="product" id="productName">
                Laden...
            </div>

            <div class="answers" id="answers"></div>

            <div class="result" id="result"></div>

        </div>

    </div>


    <div class="finished" id="finished">

        <h2>⏱️ Zeit abgelaufen!</h2>

        <div class="score" id="finalScore">
            0
        </div>

        <p id="finalMessage"></p>

        <br>

        <button class="restart" id="restart">
            🔄 Nochmal spielen
        </button>

    </div>

</div>

const products = raw
    .trim()
    .split("\n")
    .map(line => {

        const [name, plu] = line.split("|");

        return {
            name: name.trim(),
            plu: plu.trim()
        };

    });


let score = 0;
let timeLeft = 60;
let currentProduct = null;
let locked = false;
let timer = null;


const productName = document.getElementById("productName");
const answers = document.getElementById("answers");
const result = document.getElementById("result");

const scoreElement = document.getElementById("score");
const timerElement = document.getElementById("timer");

const game = document.getElementById("game");
const finished = document.getElementById("finished");

const finalScore = document.getElementById("finalScore");
const finalMessage = document.getElementById("finalMessage");

const restart = document.getElementById("restart");


function shuffle(array) {

    return [...array].sort(() => Math.random() - 0.5);

}


function startGame() {

    clearInterval(timer);

    score = 0;
    timeLeft = 60;
    locked = false;

    game.style.display = "block";
    finished.style.display = "none";

    updateTimer();
    updateScore();

    showQuestion();

    timer = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            endGame();

        }

    }, 1000);

}


function updateTimer() {

    const seconds = Math.max(0, timeLeft);

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;

    timerElement.textContent =
        `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;


    if (timeLeft <= 10) {
        timerElement.classList.add("warning");
    } else {
        timerElement.classList.remove("warning");
    }

}


function updateScore() {

    scoreElement.textContent =
        `Richtig: ${score}`;

}


function showQuestion() {

    if (timeLeft <= 0) return;

    locked = false;

    result.textContent = "";

    currentProduct =
        products[Math.floor(Math.random() * products.length)];


    productName.textContent =
        currentProduct.name;


    answers.innerHTML = "";


    const wrongAnswers = shuffle(
        products.filter(product =>
            product.plu !== currentProduct.plu
        )
    ).slice(0, 3);


    const options = shuffle([
        currentProduct,
        ...wrongAnswers
    ]);


    options.forEach(option => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = option.plu;

        button.addEventListener("click", () => {

            checkAnswer(
                button,
                option.plu,
                currentProduct.plu
            );

        });

        answers.appendChild(button);

    });

}


function checkAnswer(button, selected, correct) {

    if (locked || timeLeft <= 0) return;

    locked = true;


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(btn => {

        btn.disabled = true;

    });


    if (selected === correct) {

        score++;

        button.classList.add("correct");

        result.textContent =
            "✅ Richtig!";

        updateScore();

    } else {

        /*
            Fehler zählt nicht als Punkt.
            Das Spiel läuft einfach weiter.
        */

        button.classList.add("wrong");

        result.textContent =
            `❌ Falsch – richtig wäre ${correct}.`;

    }


    /*
        Nur eine sehr kurze Anzeige,
        damit man möglichst wenig Zeit verliert.
    */

    setTimeout(() => {

        if (timeLeft > 0) {
            showQuestion();
        }

    }, 250);

}


function endGame() {

    clearInterval(timer);

    timeLeft = 0;

    updateTimer();

    game.style.display = "none";
    finished.style.display = "block";


    finalScore.textContent =
        `${score} richtig`;


    if (score >= 30) {

        finalMessage.textContent =
            "Unfassbar schnell! 🔥";

    } else if (score >= 20) {

        finalMessage.textContent =
            "Starke Runde! 💪";

    } else if (score >= 10) {

        finalMessage.textContent =
            "Gute Geschwindigkeit! 😎";

    } else {

        finalMessage.textContent =
            "Da geht noch was! 🚀";

    }

}


restart.addEventListener(
    "click",
    startGame
);


startGame();

</script>
