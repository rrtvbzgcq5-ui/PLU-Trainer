<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLU Trainer</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#f5f8fc;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:#123b73;
}


.container{
    width:min(850px,92%);
    text-align:center;
}


/* Überschrift */

h1{
    margin:0 0 45px 0;

    font-size:
        clamp(48px,10vw,82px);

    font-weight:900;

    letter-spacing:-3px;

    color:#123b73;
}


/* Karten */

.cards{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}


/* einzelne Karte */

.card{
    text-decoration:none;

    background:#ffffff;

    border-radius:22px;

    padding:35px 20px;

    min-height:190px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    border:2px solid #dbe7f7;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;

    color:#123b73;
}


.card:hover{

    transform:translateY(-6px);

    border-color:#3f7fe0;

    box-shadow:
        0 12px 30px
        rgba(30,80,150,.12);

}


.card:active{

    transform:scale(.97);

}


/* Icon */

.icon{

    width:64px;
    height:64px;

    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#e7f0ff;

    color:#2464c4;

    font-size:30px;

    margin-bottom:18px;
}


/* Titel */

.card-title{

    font-size:22px;

    font-weight:800;

    margin-bottom:7px;

}


/* Beschreibung */

.card-description{

    font-size:14px;

    color:#6d7f96;

    line-height:1.4;

}


/* Handy */

@media(max-width:700px){

    .cards{

        grid-template-columns:1fr;

        gap:15px;

    }

    .card{

        min-height:135px;

        padding:25px;

        flex-direction:row;

        justify-content:flex-start;

        text-align:left;

    }

    .icon{

        flex-shrink:0;

        margin:0 20px 0 0;

    }

    h1{

        margin-bottom:30px;

    }

}

</style>

</head>


<body>


<div class="container">


    <h1>PLU Trainer</h1>


    <div class="cards">


        <!-- MULTIPLE CHOICE -->

        <a
            class="card"
            href="https://DEIN-USERNAME.github.io/DEIN-REPO/multiple-choice.html"
        >

            <div class="icon">
                ✓
            </div>

            <div>

                <div class="card-title">
                    Multiple Choice
                </div>

                <div class="card-description">
                    Wähle die richtige PLU aus vier Möglichkeiten.
                </div>

            </div>

        </a>



        <!-- PLU EINGABE -->

        <a
            class="card"
            href="https://DEIN-USERNAME.github.io/DEIN-REPO/plu-eingabe.html"
        >

            <div class="icon">
                #
            </div>

            <div>

                <div class="card-title">
                    PLU Eingabe
                </div>

                <div class="card-description">
                    Gib die richtige PLU selbst ein.
                </div>

            </div>

        </a>



        <!-- ÜBERSICHT -->

        <a
            class="card"
            href="https://DEIN-USERNAME.github.io/DEIN-REPO/uebersicht.html"
        >

            <div class="icon">
                ≡
            </div>

            <div>

                <div class="card-title">
                    Übersicht
                </div>

                <div class="card-description">
                    Alle Produkte und PLUs auf einen Blick.
                </div>

            </div>

        </a>


    </div>


</div>


</body>
</html>
