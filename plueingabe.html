<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLU Eingabe</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        font-family: Arial, sans-serif;
    }

    .trainer {
        width: min(520px, 92vw);
        background: #1769d1;
        color: white;
        border-radius: 24px;
        padding: 30px 22px;
        text-align: center;
        transition: background 0.2s;
    }

    .trainer.correct {
        background: #16803a;
    }

    .trainer.wrong {
        background: #b42323;
    }

    .product {
        font-size: 38px;
        font-weight: bold;
        margin-bottom: 28px;
    }

    input {
        width: 100%;
        height: 64px;
        border: none;
        border-radius: 15px;
        background: white;
        color: #123b73;
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        outline: none;
    }

    button {
        width: 100%;
        height: 64px;
        margin-top: 12px;
        border: none;
        border-radius: 15px;
        background: #3f7fe0;
        color: white;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.97);
    }

    .trainer.correct button {
        background: #36b85a;
    }

    .trainer.wrong button {
        background: #e85b5b;
    }

    .result {
        min-height: 30px;
        margin-top: 18px;
        font-size: 20px;
        font-weight: bold;
    }

    .hint {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.85;
    }
</style>
</head>

<body>

<div class="trainer" id="trainer">

    <div class="product" id="product">
        Produkt
    </div>

    <input
        id="input"
        type="number"
        inputmode="numeric"
        placeholder="PLU eingeben"
    >

    <button id="check">
        Prüfen
    </button>

    <div class="result" id="result"></div>

    <div class="hint">
        Enter drücken funktioniert auch.
    </div>

</div>


<script>

const data = raw
    .trim()
    .split("\n")
    .map(line => line.split("|"));


let current;
let lastIndex = -1;
let locked = false;


const trainer = document.getElementById("trainer");
const product = document.getElementById("product");
const input = document.getElementById("input");
const check = document.getElementById("check");
const result = document.getElementById("result");


function nextProduct() {

    locked = false;

    trainer.classList.remove("correct", "wrong");

    result.textContent = "";

    input.value = "";

    let index;

    do {
        index = Math.floor(Math.random() * data.length);
    }

    while (data.length > 1 && index === lastIndex);


    lastIndex = index;

    current = data[index];

    product.textContent = current[0];

    input.focus();
}


function checkAnswer() {

    if (locked) {
        return;
    }

    const entered = input.value.trim();

    if (!entered) {
        return;
    }

    locked = true;


    if (entered === current[1]) {

        trainer.classList.add("correct");

        result.textContent = "✓ Korrekt";

    } else {

        trainer.classList.add("wrong");

        result.textContent =
            "✕ Falsch – richtige PLU: " + current[1];
    }


    setTimeout(nextProduct, 1200);
}


check.addEventListener("click", checkAnswer);


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        checkAnswer();
    }

});


nextProduct();

</script>

</body>
