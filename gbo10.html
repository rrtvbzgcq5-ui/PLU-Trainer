<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Best of 10 – PLU Trainer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fc;
            color: #123;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #005bbb;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin: 0 0 10px;
            color: #005bbb;
        }

        .subtitle {
            text-align: center;
            color: #607080;
            margin-bottom: 35px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
            font-weight: 700;
        }

        .question-box {
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .answer {
            border: none;
            border-radius: 13px;
            padding: 18px;
            background: #005bbb;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .answer:hover {
            transform: translateY(-2px);
        }

        .answer:disabled {
            cursor: default;
        }

        .correct {
            background: #239b56 !important;
        }

        .wrong {
            background: #d9363e !important;
        }

        .result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 700;
            min-height: 27px;
        }

        .finished {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .finished h2 {
            color: #005bbb;
            font-size: 32px;
            margin-top: 0;
        }

        .score {
            font-size: 48px;
            font-weight: 800;
            margin: 20px 0;
        }

        .restart {
            border: none;
            border-radius: 13px;
            padding: 15px 25px;
            background: #005bbb;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 36px;
            }

            .answers {
                grid-template-columns: 1fr;
            }

            .product {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="game-mods.html" class="back">
        ← Zurück zu Game Mods
    </a>

    <h1>🏆 Best of 10</h1>

    <div class="subtitle">
        10 zufällige Produkte – wie viele schaffst du?
    </div>

    <div id="game">

        <div class="status">
            <span id="questionNumber">Frage 1 / 10</span>
            <span id="score">Punkte: 0</span>
        </div>

        <div class="question-box">

            <div class="product" id="productName">
                Laden...
            </div>

            <div class="answers" id="answers"></div>

            <div class="result" id="result"></div>

        </div>

    </div>


    <div class="finished" id="finished">

        <h2>🏆 Runde beendet!</h2>

        <div class="score" id="finalScore">
            0 / 10
        </div>

        <p id="finalMessage"></p>

        <br>

        <button class="restart" id="restart">
            🔄 Nochmal spielen
        </button>

    </div>

</div>

const products = raw
    .trim()
    .split("\n")
    .map(line => {
        const [name, plu] = line.split("|");
        return {
            name: name.trim(),
            plu: plu.trim()
        };
    });


let questions = [];
let currentQuestion = 0;
let score = 0;
let locked = false;


const productName = document.getElementById("productName");
const answers = document.getElementById("answers");
const result = document.getElementById("result");
const questionNumber = document.getElementById("questionNumber");
const scoreElement = document.getElementById("score");

const game = document.getElementById("game");
const finished = document.getElementById("finished");
const finalScore = document.getElementById("finalScore");
const finalMessage = document.getElementById("finalMessage");
const restart = document.getElementById("restart");


function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


function startGame() {

    score = 0;
    currentQuestion = 0;
    locked = false;

    /*
        10 verschiedene Produkte zufällig auswählen
    */

    questions = shuffle(products).slice(0, 10);

    game.style.display = "block";
    finished.style.display = "none";

    showQuestion();
}


function showQuestion() {

    locked = false;

    const question = questions[currentQuestion];

    questionNumber.textContent =
        `Frage ${currentQuestion + 1} / 10`;

    scoreElement.textContent =
        `Punkte: ${score}`;

    productName.textContent = question.name;

    result.textContent = "";

    answers.innerHTML = "";


    /*
        Die richtige PLU + 3 falsche PLUs
    */

    const wrongAnswers = shuffle(
        products.filter(product =>
            product.plu !== question.plu
        )
    ).slice(0, 3);


    const answerOptions = shuffle([
        question,
        ...wrongAnswers
    ]);


    answerOptions.forEach(option => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = option.plu;

        button.addEventListener("click", () => {
            checkAnswer(button, option.plu, question.plu);
        });

        answers.appendChild(button);
    });
}


function checkAnswer(button, selected, correct) {

    if (locked) return;

    locked = true;

    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(btn => {
        btn.disabled = true;

        if (btn.textContent === correct) {
            btn.classList.add("correct");
        }
    });


    if (selected === correct) {

        score++;

        button.classList.add("correct");

        result.textContent = "✅ Richtig!";

    } else {

        button.classList.add("wrong");

        result.textContent =
            `❌ Falsch! Richtig wäre ${correct}.`;
    }


    scoreElement.textContent =
        `Punkte: ${score}`;


    setTimeout(() => {

        currentQuestion++;

        if (currentQuestion >= 10) {
            endGame();
        } else {
            showQuestion();
        }

    }, 900);
}


function endGame() {

    game.style.display = "none";
    finished.style.display = "block";

    finalScore.textContent =
        `${score} / 10`;

    if (score === 10) {
        finalMessage.textContent =
            "Perfekt! Alle 10 richtig. 🏆";
    } else if (score >= 8) {
        finalMessage.textContent =
            "Sehr stark! 🔥";
    } else if (score >= 5) {
        finalMessage.textContent =
            "Schon ziemlich gut – weiter üben! 💪";
    } else {
        finalMessage.textContent =
            "Da geht noch was! 😄";
    }
}


restart.addEventListener("click", startGame);


startGame();
